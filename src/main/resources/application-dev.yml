# yaml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reliefV2
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6380
      connect-timeout: 6000ms
      timeout: 6000ms
      database: 0

jwt:
  secret: mySecretKey123456789012345678901234567890123456789012345678901234567890
  access-token:
    expiration: 86400000
  refresh-token:
    expiration: 604800000

server:
  port: 8080
  error:
    include-message: always